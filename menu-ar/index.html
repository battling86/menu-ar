<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Terraza Gourmet - Menú AR</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <!-- model-viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js">
  </script>

  <style>
    :root {
      --bg: #111;
      --card: #1a1a1a;
      --gold: #d4a857;
      --text: #f2f2f2;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 50px 10px;
      font-family: "Playfair Display";
      font-size: 48px;
      color: var(--gold);
      letter-spacing: 1.5px;
    }

    .menu-container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 35px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 15px;
    }

    h3 {
      font-family: "Playfair Display";
      font-size: 26px;
      margin: 20px 0 10px 0;
    }

    .price {
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .btn {
      background: var(--gold);
      border: none;
      padding: 14px 25px;
      color: #000;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .btn:hover {
      filter: brightness(1.2);
    }

    footer {
      text-align: center;
      padding: 30px;
      opacity: 0.6;
      font-size: 14px;
    }

    /* Modal visor AR */
    #visor {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
    }

    #visor model-viewer {
      width: 80vw;
      height: 80vh;
    }

    #visor .close {
      background: none;
      border: none;
      position: absolute;
      top: 25px;
      right: 25px;
      color: white;
      font-size: 35px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>La Terraza Gourmet</header>

<section class="menu-container">

  <!-- PLATILLO DEMO -->
  <div class="card">
    <img src="/img/bolonesa.jpg" alt="Spaghetti a la boloñesa"/>
    <h3>Spaghetti a la Boloñesa</h3>
    <div class="price">$189 MXN</div>
    <button class="btn" onclick="verAR()">Ver en AR</button>
  </div>

</section>

<!-- Modal con visor -->
<div id="visor">
  <button class="close" onclick="cerrarVisor()">✕</button>

  <model-viewer id="model"
    src="/models/bolonesa.glb"
    ios-src="/models/bolonesa.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    exposure="1.1">
  </model-viewer>
</div>

<script>
  function verAR() {
    document.getElementById("visor").style.display = "flex";
  }

  function cerrarVisor() {
    document.getElementById("visor").style.display = "none";
  }
</script>

<footer>
  © 2025 La Terraza Gourmet — Demo AR
</footer>

</body>
</html>
